<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ARWay - You're offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon {
      width: 48px;
      height: 48px;
      margin-bottom: 20px;
      color: #3b82f6;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #a3a3a3;
      margin: 0 0 28px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      height: 48px;
      line-height: 48px;
      background-color: #3b82f6;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .btn:active {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m0 0a9 9 0 012.828-6.364m0 0l2.829 2.829m-2.829-2.829L3 3" />
    </svg>
    <h1>You're offline</h1>
    <p>Open ARWay once while online and tap Prepare offline on the Offline setup page so everything is saved on your phone.</p>
    <button class="btn" onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
